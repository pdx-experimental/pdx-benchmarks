[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-slm-task-governance"
version = "0.1.0"
description = "Empirical benchmark evaluating deterministic task governance vs naive agent loops on small language models (1B to 8B)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ProDocuX Contributors", email = "oss@prodocux.org" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rfc8785==0.1.4",
    "scipy==1.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "nbformat>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
